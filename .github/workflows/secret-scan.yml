name: Secret Scan

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Detect committed .env file ──
      - name: Check for committed .env file
        run: |
          if [ -f .env ]; then
            echo "::error::⚠️  .env file found in repository! This should never be committed."
            echo "Add .env to .gitignore and remove it from tracking."
            exit 1
          fi
          echo "✅ No .env file found."

      # ── Check .gitignore for .env* ──
      - name: Verify .gitignore protects env files
        run: |
          if grep -q "^\.env" .gitignore; then
            echo "✅ .env files are ignored by git."
          else
            echo "::error::⚠️  .env files are NOT ignored! Add '.env*' to .gitignore."
            exit 1
          fi

      # ── Check for hardcoded API keys ──
      - name: Scan for hardcoded API keys
        run: |
          RESULTS=$(grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' . \
            2>/dev/null | grep -v node_modules | grep -v ".env.example" | grep -v ".github" || true)
          if [ -n "$RESULTS" ]; then
            echo "::error::⚠️  Possible API keys found in source code:"
            echo "$RESULTS"
            exit 1
          fi
          echo "✅ No hardcoded API keys detected."

      # ── Check for private keys ──
      - name: Scan for private keys
        run: |
          RESULTS=$(grep -rn "-----BEGIN" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' . \
            2>/dev/null | grep -v node_modules | grep -v ".env.example" || true)
          if [ -n "$RESULTS" ]; then
            echo "::error::⚠️  Possible private key detected:"
            echo "$RESULTS"
            exit 1
          fi
          echo "✅ No private keys detected."

      # ── Warn about process.env usage for sensitive vars ──
      - name: Check process.env usage for sensitive vars
        run: |
          RESULTS=$(grep -rn "process\.env\.\(.*KEY\|.*SECRET\|.*PASSWORD\|.*TOKEN\)" \
            --include='*.ts' --include='*.tsx' . 2>/dev/null | grep -v node_modules | grep -v ".env.example" | grep -v "env.ts" || true)
          if [ -n "$RESULTS" ]; then
            echo "::warning::Found process.env references to sensitive vars — ensure they're set in deployment."
            echo "$RESULTS"
          fi
          echo "✅ Env var references look clean."

      # ── Verify .env.example exists ──
      - name: Verify .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            echo "::error::Missing .env.example file!"
            exit 1
          fi
          echo "✅ .env.example exists."
